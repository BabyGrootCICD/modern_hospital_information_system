name: ci-and-codeql

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  go-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-access-service
          - patient-chart-service
          - order-clinical-service
          - lab-transfer-service
          - sync-gateway-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build service
        run: go build ./...
        working-directory: services/go/${{ matrix.service }}

      - name: Vet service
        run: go vet ./...
        working-directory: services/go/${{ matrix.service }}

  rust-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - audit-integrity-service
          - document-proof-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check
        working-directory: services/rust/${{ matrix.service }}

  web-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-next/package.json

      - name: Install deps
        run: npm install
        working-directory: apps/web-next

      - name: Build
        run: npm run build
        working-directory: apps/web-next

  docs-check:
    runs-on: ubuntu-latest
    needs: [go-backend, rust-backend, web-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docs plan files
        run: |
          test -f docs/modernization-migration-plan.md
          test -f docs/phase1-implementation-status.md
          test -f docs/phase2-implementation-status.md
          test -f docs/phase3-implementation-status.md
          test -f docs/phase4-implementation-status.md
          test -f docs/phase5-implementation-status.md
          test -f docs/phase6-implementation-status.md
          test -f infra/observability/prometheus/prometheus.yml
          test -f infra/observability/otel-collector/config.yaml

  codeql:
    runs-on: ubuntu-latest
    needs: [go-backend, rust-backend, web-frontend]
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
