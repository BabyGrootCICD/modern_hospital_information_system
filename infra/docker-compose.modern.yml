version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-next
      - identity-access-service
      - patient-chart-service
      - order-clinical-service
      - lab-transfer-service
      - sync-gateway-service
      - grafana
      - prometheus
      - redis

  web-next:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3001"
    volumes:
      - ../apps/web-next:/workspace
    ports:
      - "3001:3001"

  identity-access-service:
    image: golang:1.23-alpine
    working_dir: /workspace
    command: sh -c "go run ./cmd/api"
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: identity-access-service
    volumes:
      - ../services/go/identity-access-service:/workspace
    ports:
      - "8081:8081"

  lab-transfer-service:
    image: golang:1.23-alpine
    working_dir: /workspace
    command: sh -c "go run ./cmd/api"
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: lab-transfer-service
    volumes:
      - ../services/go/lab-transfer-service:/workspace
    ports:
      - "8084:8084"

  patient-chart-service:
    image: golang:1.23-alpine
    working_dir: /workspace
    command: sh -c "go run ./cmd/api"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: patient-chart-service
    volumes:
      - ../services/go/patient-chart-service:/workspace
    ports:
      - "8082:8082"

  sync-gateway-service:
    image: golang:1.23-alpine
    working_dir: /workspace
    command: sh -c "go run ./cmd/api"
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: sync-gateway-service
    volumes:
      - ../services/go/sync-gateway-service:/workspace
    ports:
      - "8085:8085"

  order-clinical-service:
    image: golang:1.23-alpine
    working_dir: /workspace
    command: sh -c "go run ./cmd/api"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: order-clinical-service
    volumes:
      - ../services/go/order-clinical-service:/workspace
    ports:
      - "8083:8083"

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
