events {}

http {
  upstream modern_web {
    server web-next:3001;
  }

  upstream legacy_web {
    server host.docker.internal:5001;
  }

  server {
    listen 80;
    server_name _;

    location /healthz {
      return 200 "ok\n";
    }

    location /grafana/ {
      proxy_pass http://grafana:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Incremental migration route to Next.js frontend shell.
    location /app/ {
      rewrite ^/app/(.*)$ /$1 break;
      proxy_pass http://modern_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy fallback for non-migrated pages.
    location /legacy/ {
      rewrite ^/legacy/(.*)$ /$1 break;
      proxy_pass http://legacy_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
