events {}

http {
  upstream modern_web {
    server web-next:3001;
  }

  upstream legacy_web {
    server host.docker.internal:5001;
  }

  upstream identity_api {
    server identity-access-service:8081;
  }

  upstream charts_api {
    server patient-chart-service:8082;
  }

  upstream lab_api {
    server lab-transfer-service:8084;
  }

  upstream sync_api {
    server sync-gateway-service:8085;
  }

  server {
    listen 80;
    server_name _;

    location /healthz {
      return 200 "ok\n";
    }

    location /grafana/ {
      proxy_pass http://grafana:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Incremental migration route to Next.js frontend shell.
    location /app/ {
      rewrite ^/app/(.*)$ /$1 break;
      proxy_pass http://modern_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy fallback for non-migrated pages.
    location /legacy/ {
      rewrite ^/legacy/(.*)$ /$1 break;
      proxy_pass http://legacy_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # New identity service API.
    location /api/identity/ {
      rewrite ^/api/identity/(.*)$ /$1 break;
      proxy_pass http://identity_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # New patient-chart API.
    location /api/charts/ {
      rewrite ^/api/charts/(.*)$ /$1 break;
      proxy_pass http://charts_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # New lab-transfer API.
    location /api/lab/ {
      rewrite ^/api/lab/(.*)$ /$1 break;
      proxy_pass http://lab_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # New sync-gateway API.
    location /api/sync/ {
      rewrite ^/api/sync/(.*)$ /$1 break;
      proxy_pass http://sync_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
