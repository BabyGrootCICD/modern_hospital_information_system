global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: identity-access-service
    static_configs:
      - targets: ["identity-access-service:8081"]
    metrics_path: /metrics

  - job_name: patient-chart-service
    static_configs:
      - targets: ["patient-chart-service:8082"]
    metrics_path: /metrics

  - job_name: order-clinical-service
    static_configs:
      - targets: ["order-clinical-service:8083"]
    metrics_path: /metrics

  - job_name: lab-transfer-service
    static_configs:
      - targets: ["lab-transfer-service:8084"]
    metrics_path: /metrics

  - job_name: sync-gateway-service
    static_configs:
      - targets: ["sync-gateway-service:8085"]
    metrics_path: /metrics

  - job_name: audit-integrity-service
    static_configs:
      - targets: ["audit-integrity-service:8091"]

  - job_name: document-proof-service
    static_configs:
      - targets: ["document-proof-service:8092"]
